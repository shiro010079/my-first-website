<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- Navbar Start -->
    <nav class="navbar">
        <a href="#">首頁</a>
        <a href="#about">關於我們</a>
        <a href="#contact">聯絡我們</a>
        <button id="darkModeToggle" class="theme-btn">
    <i class="fa-solid fa-moon"></i>
</button>
    </nav>
    <!-- Navbar End -->
    <section class="hero">
        <div class="hero-content">
            <div class="weather-box">
    <span id="temp">載入中...</span>
    <span id="desc"></span>
</div>
        <h2>歡迎來到我的學習筆記</h2>
        <p>這是我從零開始學習前端的第一個作品，未來還有更多可能！</p>
        <a href="#" class="btn">開始探索</a>
        </div>
    </section>
<div class="filter-container">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="html">HTML</button>
    <button class="filter-btn" data-filter="css">CSS</button>
    <button class="filter-btn" data-filter="js">JS</button>
</div>
    <section class="features reveal">
        <div class="feature-item html">
        <h3>🚀 學習歷程</h3>
        <p>從 HTML 標籤開始，一步步掌握網頁的骨架。</p>
        </div>
        <div class="feature-item css">
        <h3>🎨 視覺設計</h3>
        <p>利用 CSS 魔法，讓灰白的文字變成繽紛的網頁。</p>
        </div>
    <div class="feature-item js">
        <h3>📱 響應式佈局</h3>
        <p>無論手機或電腦，網頁都能自動調整成最美比例。</p>
    </div>
</section>
    <section class="about reveal">
        <div class="about-container">
             <img src="images/profile.jpg" alt="我的照片" class="profile-pic">
        
        <div class="about-text">
            <h2>關於我</h2>
            <p>你好！我是一個正在學習前端開發的新手，這是我努力練習的成果。</p>
        </div>
    </div>
    </section>
    <section id="contact" class="contact-section reveal">
    <h2>聯絡我們</h2>
    <div class="contact-container">
        <form id="contactForm">
            <input type="text" id="name" placeholder="您的姓名" required>
            <input type="email" id="email" placeholder="您的電子郵件" required>
            <textarea id="message" rows="5" placeholder="想對我說的話..." required></textarea>
            <button type="submit" class="submit-btn">發送訊息</button>
        </form>
    </div>
</section>
    <footer class="footer">
    <div class="footer-content">
        <p>&copy; 2026 我的學習筆記. All Rights Reserved.</p>
        <div class="social-links">
            <a href="#"><i class="fa-brands fa-facebook fa-2x"></i></a>
            <a href="#"><i class="fa-brands fa-instagram fa-2x"></i></a>
            <a href="#"><i class="fa-brands fa-github fa-2x"></i></a>
            <a href="#"><i class="fa-brands fa-line fa-2x"></i></a>
        </div>
    </div>
</footer>
<script>
        // 確保網頁內容載入後才執行
        window.onload = function() {
            const form = document.getElementById('contactForm');
            
            if (form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault(); // 攔截送出動作
                    
                    const nameValue = document.getElementById('name').value;
                    alert('哈囉 ' + nameValue + '！感謝你的聯絡，這只是個練習，訊息不會真的寄出喔！');
                    
                    this.reset(); // 清空輸入框
                });
            }
            window.addEventListener('scroll', function() {
    const reveals = document.querySelectorAll('.reveal');
    
    for (let i = 0; i < reveals.length; i++) {
        const windowHeight = window.innerHeight;
        const revealTop = reveals[i].getBoundingClientRect().top;
        const revealPoint = 150; // 距離視窗底部多少像素時觸發

        if (revealTop < windowHeight - revealPoint) {
            reveals[i].classList.add('active');
        }
    }
});
// 模擬從氣象局抓取西屯區天氣
// 改成抓取真實天氣資料
async function updateWeather() {
            try {
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=24.14&longitude=120.67&current_weather=true';
                const response = await fetch(url);
                if (!response.ok) throw new Error('網路回應不正常');
                const data = await response.json();
                const temp = data.current_weather.temperature;

                document.getElementById('temp').innerText = temp + "°C";
                document.getElementById('desc').innerText = "📍 台中即時氣溫";
            } catch (error) {
                document.getElementById('temp').innerText = "連線失敗";
            }
        }

        // 2. 重點！一定要加上這一行，才會真正去抓資料
        updateWeather();

        const themeBtn = document.getElementById('darkModeToggle');
themeBtn.addEventListener('click', function() {
    // 切換 body 的 dark-mode 類別
    document.body.classList.toggle('dark-mode');
    
    // 切換圖示：月亮變太陽
    const icon = this.querySelector('i');
    if (document.body.classList.contains('dark-mode')) {
        icon.classList.replace('fa-moon', 'fa-sun');
    } else {
        icon.classList.replace('fa-sun', 'fa-moon');
    }
});
const filterButtons = document.querySelectorAll('.filter-btn');
const items = document.querySelectorAll('.feature-item');

filterButtons.forEach(button => {
    button.addEventListener('click', function() {
        // 1. 切換按鈕的選取狀態
        document.querySelector('.filter-btn.active').classList.remove('active');
        this.classList.add('active');

        // 2. 取得要過濾的標籤
        const filterValue = this.getAttribute('data-filter');

        // 3. 顯示或隱藏內容
        items.forEach(item => {
            if (filterValue === 'all' || item.classList.contains(filterValue)) {
                item.classList.remove('hide');
            } else {
                item.classList.add('hide');
            }
        });
    });
});
        };
    </script>
</body>
</html>
</body>
</html>
